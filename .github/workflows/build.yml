name: Build MoodyVid IPA

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      # The release step commits this file back. Without the ignore, that commit
      # would start another build, which would commit again — a loop.
      - 'source.json'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build a side-by-side test copy (own bundle id, name and icon colour)'
        type: boolean
        default: false

# Test and build jobs can read source/dependencies, but cannot modify releases.
# Only the guarded publish job below receives a write token.
permissions:
  contents: read

jobs:
  # Fast gate: the downloader's Python contract is testable off-device.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install Pillow

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Run portable cookie policy tests
        run: bash scripts/http-policy-tests.sh

      - name: Run portable transfer and torrent policy tests
        run: bash scripts/transfer-policy-tests.sh

      - name: Check translations
        run: python3 scripts/check-strings.py

  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ldid || echo "ldid not available, codesign will be used"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          which ldid || true

      - name: Run torrent core tests
        run: bash scripts/torrent-tests.sh

      - name: Run native queue recovery tests
        run: bash scripts/queue-tests.sh

      - name: Run native privacy tests
        run: bash scripts/privacy-tests.sh

      - name: Run native transfer tests
        run: bash scripts/transfer-tests.sh

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          # A side-by-side copy has a separate identity and sandbox.
          MV_APP_NAME: ${{ inputs.variant && 'MoodyVidTest' || 'MoodyVid' }}
          MV_BUNDLE_ID: ${{ inputs.variant && 'com.mody.moodyvid.test' || 'com.mody.moodyvid' }}
          MV_DISPLAY_NAME: ${{ inputs.variant && 'MoodyVid Test' || 'MoodyVid' }}
          MV_ICON_TOP: ${{ inputs.variant && '150,90,220' || '18,172,186' }}
          MV_ICON_BOTTOM: ${{ inputs.variant && '95,50,160' || '8,116,132' }}
        run: bash scripts/build.sh

      # Every branch and test variant still gets a downloadable Actions artifact.
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.variant && 'MoodyVidTest-ipa' || 'MoodyVid-ipa' }}
          path: ${{ inputs.variant && 'build/MoodyVidTest.ipa' || 'build/MoodyVid.ipa' }}
          if-no-files-found: error

  # A push or manual non-variant run on main is the only official publisher.
  # Experimental branches, tags and variant builds cannot reach this job.
  publish:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && !inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: moodyvid-official-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Builds can finish out of order. A later code or source.json change
      # makes this artifact stale. Docs-only commits are safe and do not start
      # another build, so base the source.json commit on that newer docs tip.
      - name: Check current main revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          TIP=$(git rev-parse FETCH_HEAD)
          if python3 scripts/publish_revision.py "$GITHUB_SHA" "$TIP"; then
            git checkout --detach "$TIP"
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            CODE=$?
            if [ "$CODE" -ne 1 ]; then exit "$CODE"; fi
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Main has newer code or a newer publication; skipping this build.'
          fi

      - name: Download official IPA artifact
        if: ${{ steps.revision.outputs.current == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: MoodyVid-ipa
          path: build

      - name: Validate official IPA metadata
        if: ${{ steps.revision.outputs.current == 'true' }}
        run: python3 scripts/ipa_metadata.py build/MoodyVid.ipa --expected-build "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Publish release
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A new commit can land after the first revision check while the IPA
          # is downloading. Recheck before changing release metadata and again
          # immediately before replacing the asset. GitHub offers no atomic
          # operation across a branch update and a release upload.
          check_main_is_publishable() {
            local tip
            git fetch --no-tags origin refs/heads/main
            tip=$(git rev-parse FETCH_HEAD)
            if ! python3 scripts/publish_revision.py "$GITHUB_SHA" "$tip"; then
              echo '::error::Main moved since this build; refusing to modify the release.'
              return 1
            fi
          }
          check_main_is_publishable
          NOTES=$(cat <<EOF
          **MoodyVid $VERSION** (build ${{ github.run_number }})

          **يتطلّب:** آيفون بنظام iOS 15 أو أحدث (لا يعمل على آيباد)
          **Requires:** iPhone running iOS 15 or newer (iPad is not supported)

          **التثبيت / Install** — أضف هذا الرابط في AltStore أو SideStore ← Sources:
          https://raw.githubusercontent.com/${{ github.repository }}/main/source.json

          أو حمّل ملف IPA من الأسفل ووقّعه بنفسك.
          Or download the IPA below and sign it yourself.
          EOF
          )
          # One rolling release. --clobber keeps the download URL stable.
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create latest --repo "${{ github.repository }}" \
                 --title "MoodyVid — أحدث إصدار" --notes "$NOTES"
          gh release edit latest --repo "${{ github.repository }}" --notes "$NOTES"
          check_main_is_publishable
          gh release upload latest build/MoodyVid.ipa Resources/icon-source.png \
            --repo "${{ github.repository }}" --clobber

      - name: Verify download link
        if: ${{ steps.revision.outputs.current == 'true' }}
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/latest/MoodyVid.ipa"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then echo "download link OK: $URL"; exit 0; fi
            echo "attempt $attempt: HTTP $CODE, retrying…"
            sleep 5
          done
          echo "ERROR: $URL did not resolve to 200"; exit 1

      - name: Write AltStore source
        if: ${{ steps.revision.outputs.current == 'true' }}
        run: |
          set -e
          python3 scripts/make_source.py \
            --ipa build/MoodyVid.ipa \
            --version "$VERSION" \
            --build "${{ github.run_number }}" \
            --min-os "$MINOS" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/latest/MoodyVid.ipa" \
            --icon-url "https://raw.githubusercontent.com/${{ github.repository }}/main/Resources/icon-source.png" \
            --size "$SIZE" \
            --notes "MoodyVid $VERSION (build ${{ github.run_number }}) — iOS $MINOS+, iPhone only" \
            --screenshots-index Resources/screenshots/index.json \
            --screenshot-base-url "https://raw.githubusercontent.com/${{ github.repository }}/main/Resources/screenshots" \
            --out source.json

      - name: Commit source.json
        if: ${{ steps.revision.outputs.current == 'true' }}
        run: |
          set -e
          git config user.name "moodyvid-bot"
          git config user.email "moodyvid-bot@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          git add source.json
          git diff --cached --quiet && { echo "source.json unchanged"; exit 0; }
          git commit -m "release: MoodyVid $VERSION (build ${{ github.run_number }})"
          git fetch --no-tags origin refs/heads/main
          TIP=$(git rev-parse FETCH_HEAD)
          # If only docs moved since publication, preserve them while committing.
          # Any code/new source change aborts instead of overwriting it.
          python3 scripts/publish_revision.py "$BASE" "$TIP"
          git rebase "$TIP"
          git push origin HEAD:refs/heads/main
