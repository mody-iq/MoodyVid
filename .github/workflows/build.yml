name: Build MoodyVid IPA

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate: the downloader's Python contract is testable off-device, and these
  # run in seconds on Linux. If they fail there is no point paying for macOS.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run downloader tests
        run: python3 -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ldid || echo "ldid not available, codesign will be used"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          which ldid || true

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: MoodyVid-ipa
          path: build/MoodyVid.ipa
          if-no-files-found: error
