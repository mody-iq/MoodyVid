name: Build MoodyVid IPA

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ldid || echo "ldid not available, codesign will be used"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          which ldid || true

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoodyVid-ipa
          path: build/MoodyVid.ipa
          if-no-files-found: error
