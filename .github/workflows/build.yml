name: Build MoodyVid IPA

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoodyVid-ipa
          path: build/MoodyVid.ipa
          if-no-files-found: error
