name: Build MoodyVid IPA

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      # The release step commits this file back. Without the ignore, that commit
      # would start another build, which would commit again — a loop.
      - 'source.json'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build a side-by-side test copy (own bundle id, name and icon colour)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Fast gate: the downloader's Python contract is testable off-device, and these
  # run in seconds on Linux. If they fail there is no point paying for macOS.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run downloader tests
        run: python3 -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ldid || echo "ldid not available, codesign will be used"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          which ldid || true

      # The torrent core (bencode, SHA-1, magnet, metadata, tracker) is pure
      # Foundation, so it is proven here with the system clang before the device
      # build — a wrong info-hash or piece offset would otherwise only show up as
      # a download that never verifies.
      - name: Run torrent core tests
        run: bash scripts/torrent-tests.sh

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          # The side-by-side copy keeps its own identity so it installs next to the
          # shipping app instead of replacing it. Both share the same Documents
          # folder inside their own container, so the two are fully independent.
          MV_APP_NAME: ${{ inputs.variant && 'MoodyVidTest' || 'MoodyVid' }}
          MV_BUNDLE_ID: ${{ inputs.variant && 'com.mody.moodyvid.test' || 'com.mody.moodyvid' }}
          MV_DISPLAY_NAME: ${{ inputs.variant && 'MoodyVid Test' || 'MoodyVid' }}
          MV_ICON_TOP: ${{ inputs.variant && '150,90,220' || '18,172,186' }}
          MV_ICON_BOTTOM: ${{ inputs.variant && '95,50,160' || '8,116,132' }}
        run: bash scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.variant && 'MoodyVidTest-ipa' || 'MoodyVid-ipa' }}
          path: ${{ inputs.variant && 'build/MoodyVidTest.ipa' || 'build/MoodyVid.ipa' }}
          if-no-files-found: error

      # The artifact above is private and disappears after 90 days. The release
      # asset below is public and permanent, and is what the AltStore source
      # points at — so a user who installs once keeps getting updates.
      - name: Publish release
        if: ${{ !inputs.variant }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Payload/MoodyVid.app/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          NOTES=$(cat <<EOF
          **MoodyVid $VERSION** (build ${{ github.run_number }})

          **يتطلّب:** آيفون بنظام iOS 15 أو أحدث (لا يعمل على آيباد)
          **Requires:** iPhone running iOS 15 or newer (iPad is not supported)

          **التثبيت / Install** — أضف هذا الرابط في AltStore أو SideStore ← Sources:
          https://raw.githubusercontent.com/${{ github.repository }}/main/source.json

          أو حمّل ملف IPA من الأسفل ووقّعه بنفسك.
          Or download the IPA below and sign it yourself.
          EOF
          )
          # One rolling release on the tag "latest". --clobber replaces its assets,
          # so the download URL in source.json is fixed for the life of the repo.
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create latest --repo "${{ github.repository }}" \
                 --title "MoodyVid — أحدث إصدار" --notes "$NOTES"
          gh release edit latest --repo "${{ github.repository }}" --notes "$NOTES"
          gh release upload latest build/MoodyVid.ipa Resources/icon-source.png \
            --repo "${{ github.repository }}" --clobber

      # A source.json that points at a dead URL installs nothing, and the user
      # sees only a generic failure. Prove the link works before publishing it.
      - name: Verify download link
        if: ${{ !inputs.variant }}
        run: |
          set -e
          URL="https://github.com/${{ github.repository }}/releases/download/latest/MoodyVid.ipa"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then echo "download link OK: $URL"; exit 0; fi
            echo "attempt $attempt: HTTP $CODE, retrying…"
            sleep 5
          done
          echo "ERROR: $URL did not resolve to 200"; exit 1

      - name: Write AltStore source
        if: ${{ !inputs.variant }}
        run: |
          set -e
          SIZE=$(stat -f%z build/MoodyVid.ipa)
          # Read the requirement from the app itself, so the published source can
          # never disagree with what the binary actually supports.
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Payload/MoodyVid.app/Info.plist)
          python3 scripts/make_source.py \
            --ipa build/MoodyVid.ipa \
            --version "$VERSION" \
            --build "${{ github.run_number }}" \
            --min-os "$MINOS" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/latest/MoodyVid.ipa" \
            --icon-url "https://raw.githubusercontent.com/${{ github.repository }}/main/Resources/icon-source.png" \
            --size "$SIZE" \
            --notes "MoodyVid $VERSION (build ${{ github.run_number }}) — iOS $MINOS+, iPhone only" \
            --out source.json

      - name: Commit source.json
        if: ${{ !inputs.variant }}
        run: |
          set -e
          git config user.name "moodyvid-bot"
          git config user.email "moodyvid-bot@users.noreply.github.com"
          git add source.json
          git diff --cached --quiet && { echo "source.json unchanged"; exit 0; }
          git commit -m "release: MoodyVid $VERSION (build ${{ github.run_number }})"
          # Explicit ref: a checkout of a tag or a detached HEAD has no upstream
          # to push to, and this must always land on the branch the raw URL reads.
          git push origin HEAD:${GITHUB_REF_NAME}
